[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-ai"
version = "0.1.0"
description = "Reproducible Fashion-MNIST CNN training and inference API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "tensorflow-cpu==2.21.0", "numpy>=1.26,<3", "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4", "Pillow>=10,<13", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
